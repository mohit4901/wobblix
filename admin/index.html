<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wobblix Admin | Dashboard</title>
    
    <!-- Tab Title Animation on Switch -->
    <script>
      (function() {
        const originalTitle = "Wobblix Admin | Dashboard";
        let animatedTitleInterval;
        const messages = ["Come back! 😢", "We miss you! Admin ❤️", "Check dashboard updates! ⚡️"];
        let msgIndex = 0;

        document.addEventListener("visibilitychange", function() {
          if (document.visibilityState === "hidden") {
            msgIndex = 0;
            document.title = messages[msgIndex];
            animatedTitleInterval = setInterval(function() {
              msgIndex = (msgIndex + 1) % messages.length;
              document.title = messages[msgIndex];
            }, 1800);
          } else {
            clearInterval(animatedTitleInterval);
            document.title = originalTitle;
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
